const trackPrice = 299;
const discountTrackMinimum = 11;
const storageKey = 'b6l-store-cart';
const languages = {pt:'pt-PT',en:'en-IE',es:'es-ES',fr:'fr-FR',de:'de-DE',ja:'ja-JP',zh:'zh-CN',ar:'ar-SA'};
const byId = id => document.getElementById(id);
const select = byId('language');
const search = byId('search');
const list = byId('tracks');
const checkout = byId('checkout');
const clear = byId('clear');
const cart = byId('cart');
const rows = new Map();
const titles = new Map(tracks.map(track => [track.id, track.title]));
const normalize = value => value.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().trim();
let language = 'pt';
let activeTrack;
let saved;
try { saved = JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch {}
const selected = new Set(Array.isArray(saved) ? saved.filter(id => titles.has(id)) : []);

function money(cents) {
  return new Intl.NumberFormat(languages[language], {style:'currency',currency:'EUR'}).format(cents / 100);
}
function checkoutUrl(ids) {
  const url = new URL('https://payhip.com/buy');
  if (ids.length === 1) url.searchParams.set('link', ids[0]);
  else ids.forEach(id => url.searchParams.append('cart_links[]', id));
  return url.href;
}
function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text) element.textContent = text;
  return element;
}
function makeButton(className) {
  const button = makeElement('button', className);
  button.type = 'button';
  return button;
}
const player = makeElement('div', 'player');
const soundcloud = makeElement('a', 'btn', 'SoundCloud');
soundcloud.target = '_blank';
soundcloud.rel = 'noopener noreferrer';
const close = makeButton('btn');
const playerFrame = makeElement('iframe');
playerFrame.allow = 'autoplay';
player.append(soundcloud, ' ', close, playerFrame);
close.addEventListener('click', () => closePlayer(true));

function closePlayer(returnFocus = false) {
  if (!activeTrack) return;
  const button = rows.get(activeTrack.id).listen;
  button.setAttribute('aria-expanded', 'false');
  playerFrame.removeAttribute('src');
  player.remove();
  activeTrack = undefined;
  if (returnFocus) button.focus();
}
function togglePlayer(track) {
  const previous = activeTrack;
  closePlayer();
  if (previous === track) return;
  const url = new URL('https://w.soundcloud.com/player/');
  url.searchParams.set('url', track.sound);
  url.searchParams.set('color', '#e2c384');
  url.searchParams.set('auto_play', 'false');
  url.searchParams.set('show_comments', 'false');
  url.searchParams.set('hide_related', 'true');
  soundcloud.href = track.sound;
  playerFrame.title = copy[language].listen + ' · ' + track.title;
  playerFrame.src = url.href;
  const row = rows.get(track.id);
  row.item.append(player);
  row.listen.setAttribute('aria-expanded', 'true');
  activeTrack = track;
}
function updateSelection() {
  const t = copy[language];
  for (const [id, row] of rows) {
    const added = selected.has(id);
    row.add.textContent = added ? t.remove : t.add;
    row.add.setAttribute('aria-label', row.add.textContent + ' · ' + titles.get(id));
    row.add.setAttribute('aria-pressed', String(added));
  }
  const count = selected.size;
  byId('count').textContent = new Intl.NumberFormat(languages[language]).format(count);
  byId('total').textContent = money(count * trackPrice);
  clear.hidden = !count;
  byId('coupon').hidden = count < discountTrackMinimum;
  checkout.setAttribute('aria-disabled', String(!count));
  if (count) checkout.href = checkoutUrl(tracks.filter(track => selected.has(track.id)).map(track => track.id));
  else checkout.removeAttribute('href');
}
function saveSelection() {
  try { localStorage.setItem(storageKey, JSON.stringify([...selected])); } catch {}
  updateSelection();
}

for (const track of tracks) {
  const item = makeElement('li','track');
  const row = makeElement('div','track-row');
  const cover = track.cover ? makeElement('img','cover') : makeElement('span','cover-wav','WAV');
  if (track.cover) {
    cover.src = new URL(track.cover, new URL('assets/', location.href)).href;
    cover.alt = '';
    cover.loading = 'lazy';
    cover.width = 50;
    cover.height = 50;
  } else cover.setAttribute('aria-hidden', 'true');
  const title = makeElement('div','title',track.title);
  title.dir = 'auto';
  const format = makeElement('div','format',track.format);
  format.dir = 'ltr';
  const meta = makeElement('div');
  meta.append(title,format);
  const actions = makeElement('div','actions');
  const price = makeElement('span','price');
  const listen = makeButton('btn');
  listen.setAttribute('aria-expanded','false');
  listen.addEventListener('click', () => togglePlayer(track));
  const add = makeButton('btn');
  add.addEventListener('click', () => {
    if (selected.has(track.id)) selected.delete(track.id);
    else selected.add(track.id);
    saveSelection();
  });
  actions.append(price,listen,add);
  row.append(cover,meta,actions);
  item.append(row);
  list.append(item);
  rows.set(track.id,{item,price,listen,add});
}
clear.addEventListener('click', () => {
  selected.clear();
  saveSelection();
  search.focus();
});
search.addEventListener('input', () => {
  const query = normalize(search.value);
  let visible = 0;
  for (const track of tracks) {
    const shown = normalize(track.title).includes(query);
    rows.get(track.id).item.hidden = !shown;
    if (shown) visible++;
    else if (activeTrack === track) closePlayer();
  }
  byId('empty').hidden = visible !== 0;
});

function renderLanguage(next) {
  language = Object.hasOwn(copy,next) ? next : 'pt';
  select.value = language;
  const t = copy[language];
  document.documentElement.lang = language === 'zh' ? 'zh-Hans' : language;
  document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
  document.title = t.title + ' | STUDIOSB6L';
  select.setAttribute('aria-label',t.language);
  search.placeholder = t.search;
  search.setAttribute('aria-label',t.search);
  document.querySelectorAll('[data-label]').forEach(el => { el.textContent = t[el.dataset.label]; });
  document.querySelectorAll('[data-home]').forEach(el => { el.href = language + '.html'; });
  for (const track of tracks) {
    const row = rows.get(track.id);
    row.price.textContent = money(trackPrice);
    row.listen.textContent = t.listen;
    row.listen.setAttribute('aria-label',t.listen + ' · ' + track.title);
  }
  byId('bundle-price').textContent = money(1499);
  close.textContent = t.close;
  if (activeTrack) playerFrame.title = t.listen + ' · ' + activeTrack.title;
  cart.setAttribute('aria-label',t.selected);
  updateSelection();
}
select.addEventListener('change', () => {
  renderLanguage(select.value);
  const url = new URL(location.href);
  url.searchParams.set('lang',language);
  history.replaceState(null,'',url);
});
const requested = new URLSearchParams(location.search).get('lang');
let preferred;
try { preferred = localStorage.getItem('b6l-language'); } catch {}
renderLanguage(requested || preferred || 'pt');
</script></body></html>
