name: Configure Payhip secrets while registration is disabled
on:
  push:
    branches:
      - ops/payhip-secret-setup-20261124
permissions:
  contents: read
concurrency:
  group: studiosb6l-cloudflare-production
  cancel-in-progress: false
jobs:
  configure-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configuration guards without real credentials
        run: node --test tests/payhip-secret-setup.test.mjs
      - name: Configure only missing backend secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYHIP_WEBHOOK_API_KEY: ${{ secrets.PAYHIP_WEBHOOK_API_KEY }}
        run: node scripts/setup-payhip-secrets.mjs
