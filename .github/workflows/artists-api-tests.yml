name: STUDIOSB6L API security tests
on:
  push:
    paths:
      - 'cloudflare/artists-registration-worker.js'
      - 'tests/artists-registration-worker.test.mjs'
      - '.github/workflows/artists-api-tests.yml'
  pull_request:
    paths:
      - 'cloudflare/artists-registration-worker.js'
      - 'tests/artists-registration-worker.test.mjs'
      - '.github/workflows/artists-api-tests.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker JavaScript syntax
        run: node --check cloudflare/artists-registration-worker.js
      - name: Run non-destructive registration API tests
        run: node --test tests/artists-registration-worker.test.mjs
