name: STUDIOSB6L API security tests
on:
  push:
    paths:
      - 'cloudflare/artists-registration-worker.js'
      - 'cloudflare/authorization-policy.mjs'
      - 'cloudflare/session-guard.mjs'
      - 'cloudflare/logout-worker.mjs'
      - 'tests/artists-registration-worker.test.mjs'
      - 'tests/authorization-policy.test.mjs'
      - 'tests/session-guard.test.mjs'
      - 'tests/logout-worker.test.mjs'
      - '.github/workflows/artists-api-tests.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare/artists-registration-worker.js'
      - 'tests/artists-registration-worker.test.mjs'
      - '.github/workflows/artists-api-tests.yml'
concurrency:
  group: artists-security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker JavaScript syntax
        run: node --check cloudflare/artists-registration-worker.js
      - name: Run security and authorization tests
        run: node --test tests/artists-registration-worker.test.mjs tests/authorization-policy.test.mjs tests/session-guard.test.mjs tests/logout-worker.test.mjs
      - name: Verify test suite count
        run: |
          count=$(grep -c "^test(" tests/artists-registration-worker.test.mjs)
          echo "Registered tests: $count"
          test "$count" -ge 23
          node --check cloudflare/authorization-policy.mjs
          node --check cloudflare/session-guard.mjs
          node --check cloudflare/logout-worker.mjs
