name: STUDIOSB6L API security tests
on:
  push:
    paths:
      - 'cloudflare/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/artists-api-tests.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'tests/**'
      - '.github/workflows/artists-api-tests.yml'
concurrency:
  group: artists-security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate worker JavaScript syntax
        run: node --check cloudflare/artists-registration-worker.js
      - name: Run security and authorization tests
        run: node --test tests/*.test.mjs
      - name: Verify test suite coverage and module syntax
        run: |
          count=$(grep -hEc '^test\(' tests/*.test.mjs | awk '{s+=$1} END {print s+0}')
          echo "Registered tests across modules: $count"
          test "$count" -ge 65
          node --check cloudflare/authorization-policy.mjs
          node --check cloudflare/session-guard.mjs
          node --check cloudflare/logout-worker.mjs
          node --check cloudflare/session-tokens.mjs
          node --check cloudflare/password-verifier.mjs
          node --check cloudflare/login-worker.mjs
