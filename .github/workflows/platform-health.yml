name: STUDIOSB6L - Daily platform health
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate local SEO files
        shell: bash
        run: |
          set -euo pipefail
          test -s robots.txt
          test -s sitemap.xml
          test -s sitemap-artistas.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for sitemap in ('sitemap.xml','sitemap-artistas.xml'):
              root=ET.parse(sitemap).getroot()
              assert root.tag.endswith('urlset'), f'Invalid root: {sitemap}'
              urls=[node.text for node in root.iter() if node.tag.endswith('}loc')]
              assert urls, f'Empty sitemap: {sitemap}'
              assert len(urls)==len(set(urls)), f'Duplicate URLs: {sitemap}'
              assert all(u and u.startswith('https://www.studiosb6l.com/') for u in urls), f'Invalid URL: {sitemap}'
              print(f'{sitemap}: {len(urls)} URLs validated')
          robots=Path('robots.txt').read_text()
          assert 'Sitemap:' in robots, 'Missing sitemap declaration'
          assert 'sitemap-artistas.xml' in robots, 'Artist sitemap missing from robots.txt'
          PY
      - name: Audit SEO sitemap quality
        run: python3 scripts/audit-seo.py
      - name: Test artist registration Worker offline
        run: node tests/artists-worker.test.mjs
      - name: Check public endpoints
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for url in \
            'https://www.studiosb6l.com/' \
            'https://www.studiosb6l.com/robots.txt' \
            'https://www.studiosb6l.com/sitemap.xml' \
            'https://www.studiosb6l.com/sitemap-artistas.xml' \
            'https://www.studiosb6l.com/concertos/artistas/' \
            'https://www.studiosb6l.com/instalar.html'; do
            code=$(curl --location --silent --show-error --output /dev/null --max-time 25 --retry 2 --write-out '%{http_code}' "$url") || code=000
            echo "$url HTTP $code"
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Check canonical and indexing metadata on public pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          from html.parser import HTMLParser

          base = "https://www.studiosb6l.com"
          paths = ["/", "/concertos/", "/concertos/artistas/"]
          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonicals = []
                  self.robots = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "link" and "canonical" in a.get("rel", "").lower().split():
                      self.canonicals.append(a.get("href", ""))
                  if tag == "meta" and a.get("name", "").lower() == "robots":
                      self.robots.append(a.get("content", "").lower())

          for path in paths:
              url = base + path
              request = urllib.request.Request(url, headers={"User-Agent": "STUDIOSB6L-HealthCheck/1.0"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  html = response.read(2_000_000).decode("utf-8", "replace")
              parser = Metadata()
              parser.feed(html)
              print(f"{url}: canonical={parser.canonicals}, robots={parser.robots}")
              assert len(parser.canonicals) == 1, f"Expected one canonical on {url}"
              assert parser.canonicals[0] == url, f"Unexpected canonical on {url}"
              assert not any("noindex" in value for value in parser.robots), f"Unexpected noindex on {url}"
          PY
      - name: Open or update failure alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="STUDIOSB6L: daily health check failed"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "STUDIOSB6L: daily health check failed") | .number' | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "A daily health check failed. Review run: $url"
          else
            gh issue create --title "$title" --body "Automated health check failed. Review the workflow logs: $url. No production data was modified."
          fi
