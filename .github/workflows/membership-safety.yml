name: Membership financial safety tests
on:
  pull_request:
    paths:
      - 'professional-contracts/**'
      - 'cloudflare/membership-checkout-worker.js'
      - '.github/workflows/membership-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check worker syntax
        run: node --check cloudflare/membership-checkout-worker.js
      - name: Run policy tests
        working-directory: professional-contracts
        run: npm test
