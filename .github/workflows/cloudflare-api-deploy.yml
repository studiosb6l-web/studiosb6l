name: Cloudflare API access and paused deployment
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify access or publish with new registrations disabled
        required: true
        default: verify-access
        type: choice
        options:
          - verify-access
          - deploy-paused
      free_quotas_verified:
        description: Confirm current global usage and this operation remain below 70 percent of every free quota
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: studiosb6l-cloudflare-production
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit quota verification
        env:
          QUOTAS_VERIFIED: ${{ inputs.free_quotas_verified }}
        run: |
          if [ "$QUOTAS_VERIFIED" != "true" ]; then
            echo "Global free quotas have not been verified. No Cloudflare operation executed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test selected revision
        run: npm test
      - name: Compile without publishing
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check:worker
      - name: Verify credential, fixed Worker, D1 binding and rollback versions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-api-access.mjs
      - name: Save previous version identifiers for rollback
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-previous-versions-${{ github.run_id }}
          path: .wrangler/access-check/target.json
          retention-days: 30
          if-no-files-found: error
      - name: Block accidental suspension of existing live registrations
        if: inputs.operation == 'deploy-paused'
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const previous=JSON.parse(fs.readFileSync('.wrangler/access-check/target.json','utf8'));
          if(previous.productionRegistrationEnabled)throw Error('Live registration is already enabled. This paused rollout requires a separate reviewed change.');
          JS
      - name: Deploy with new registrations and payment activation disabled
        if: inputs.operation == 'deploy-paused'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '8ada1c4a636906c35b369d4d682f6d4e'
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --var REGISTRATION_ENABLED:false --var PAYHIP_ACTIVATION_VERIFIED:false
      - name: Report actual scope
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo '## Cloudflare API route'
            echo "Requested operation: $REQUESTED_OPERATION"
            echo 'Tests and compilation passed; target access was verified.'
            echo 'No migrations, payment credentials, email credentials, paid plans or new resources were created.'
            echo 'This workflow does not activate paid registrations or validate a real payment.'
            echo 'Previous deployed version identifiers are in the rollback artifact. Database content was not exported.'
          } >> "$GITHUB_STEP_SUMMARY"
