name: STUDIOSB6L Worker build verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify_onboarding_schema.py'
      - '.github/workflows/worker-build-check.yml'
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate onboarding D1 migrations locally
        run: python3 scripts/verify_onboarding_schema.py
      - name: Verify Cloudflare Worker bundle without deployment
        run: npx --yes --package wrangler@4 wrangler deploy --dry-run --outdir /tmp/studiosb6l-worker-bundle
      - name: Confirm generated bundle exists
        run: |
          find /tmp/studiosb6l-worker-bundle -type f -maxdepth 3 -print
          find /tmp/studiosb6l-worker-bundle -type f \( -name '*.js' -o -name '*.mjs' \) -size +0c | grep -q .
