name: Update official Disney and Warner live TV
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-live-update
  cancel-in-progress: false
jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify live streams and embedding
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_studio_live.py
      - name: Commit changes if needed
        run: |
          if ! git diff --quiet -- assets/studio-live.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/studio-live.json
            git commit -m "Refresh verified official TV livestreams"
            git push
          fi
