name: STUDIOSB6L Competitor intelligence radar
on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public official competitor pages
        run: python3 scripts/competitor-intelligence.py
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-intelligence-report
          path: competitor-intelligence-report.json
          retention-days: 90
