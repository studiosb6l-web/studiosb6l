name: Atualizar noticias musicais
on:
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'
permissions:
  contents: write
concurrency:
  group: music-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Recolher noticias publicas
        run: python scripts/update_music_news.py
      - name: Validar videos oficiais Disney e Warner
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_studio_videos.py
      - name: Publicar apenas quando houver alteracoes
        run: |
          git config user.name "studiosb6l-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/music-news.json assets/studio-videos.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar noticias musicais verificaveis"
            git push
          fi
