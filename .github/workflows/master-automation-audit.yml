name: STUDIOSB6L - Master automation supervisor
on:
  schedule:
    - cron: '19 */3 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: master-automation-audit
  cancel-in-progress: false
jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit registered automations and recent failures
        run: python3 scripts/master-automation-audit.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-automation-audit
          path: master-automation-audit.json
          retention-days: 30
      - name: Open or update issue on audit failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          title="STUDIOSB6L: master automation audit needs attention"
          link="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "STUDIOSB6L: master automation audit needs attention") | .number' | head -n1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Another audit failure: $link"
          else
            gh issue create --title "$title" --body "Master audit found a workflow error or stale automation: $link. Review before changing production."
          fi
