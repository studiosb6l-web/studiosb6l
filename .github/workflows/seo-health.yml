name: SEO health monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit site discovery and indexing readiness
        run: python scripts/seo_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-health-report
          path: seo-health-report.json
          retention-days: 30
