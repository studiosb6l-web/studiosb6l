name: Artist registration security regression
on:
  pull_request:
    paths:
      - 'cloudflare/artists-registration-worker.js'
      - 'tests/artist-registration-security.test.mjs'
      - '.github/workflows/artist-registration-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify registration security contract without external services
        run: node tests/artist-registration-security.test.mjs
