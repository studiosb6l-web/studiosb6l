name: STUDIOSB6L - Solution proposals safety
on:
  workflow_dispatch:
  schedule:
    - cron: '52 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'cloudflare/solution-proposals.mjs'
      - 'cloudflare/opportunity-keywords.mjs'
      - 'tests/solution-proposals.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/solution-proposals.test.mjs
