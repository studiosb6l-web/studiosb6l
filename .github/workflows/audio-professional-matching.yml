name: Audio professional matching checks
on:
  push:
    paths:
      - 'cloudflare/audio-professional-matching.mjs'
      - 'tests/audio-professional-matching.test.mjs'
      - '.github/workflows/audio-professional-matching.yml'
  pull_request:
    paths:
      - 'cloudflare/audio-professional-matching.mjs'
      - 'tests/audio-professional-matching.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tests/audio-professional-matching.test.mjs
