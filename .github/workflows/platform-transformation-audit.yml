name: STUDIOSB6L Product transformation audit
on:
  workflow_dispatch:
  schedule:
    - cron: '29 6 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/platform-transformation-audit.py
      - uses: actions/upload-artifact@v7
        with:
          name: platform-transformation-report
          path: platform-transformation-report.json
          retention-days: 60
