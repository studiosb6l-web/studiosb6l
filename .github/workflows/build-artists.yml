name: Build 10000 artist profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_artist_directory.py'
      - '.github/workflows/build-artists.yml'
concurrency:
  group: studiosb6l-artist-directory-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified artist directory
        run: python scripts/build_artist_directory.py
      - name: Commit checkpoint and generated profiles together
        shell: bash
        run: |
          set -e
          git config user.name "STUDIOSB6L Directory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- artist-import-checkpoint.json artist-import-offset.txt concertos/artistas sitemap-artistas.xml
          if git diff --cached --quiet; then
            python - <<'PY'
          import json, re
          from pathlib import Path
          source = Path("scripts/build_artist_directory.py").read_text(encoding="utf-8")
          target = int(re.search(r"^TARGET=(\d+)", source, re.M).group(1))
          catalog = Path("concertos/artistas/catalogo.json")
          count = len(json.loads(catalog.read_text(encoding="utf-8"))) if catalog.exists() else 0
          print(f"Directory records: {count}; target: {target}")
          if count < target:
              raise SystemExit("Target not reached and no new records were generated")
          print("Directory already up to date; no new commit needed")
          PY
            exit 0
          fi
          git commit -m "Save verified artist import progress and generated profiles"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Artist directory published"
              exit 0
            fi
            echo "Push conflict, fetching latest main and rebasing committed changes"
            git fetch origin main
            git rebase origin/main
            sleep 2
          done
          echo "Unable to publish after three attempts"
          exit 1
