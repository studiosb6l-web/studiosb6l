name: Build 10000 artist profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_artist_directory.py'
      - '.github/workflows/build-artists.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified artist directory
        run: python scripts/build_artist_directory.py
      - name: Commit generated pages and sitemap
        run: |
          git config user.name "STUDIOSB6L Directory Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concertos/artistas sitemap-artistas.xml
          if ! git diff --cached --quiet; then
            git commit -m "Generate 10000 verified in-site artist profiles"
            git push
          fi
