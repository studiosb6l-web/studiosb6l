name: Build STUDIOSB6L Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Build Android APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk STUDIOSB6L-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STUDIOSB6L-Android
          path: STUDIOSB6L-Android.apk
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v1 >/dev/null 2>&1 || gh release create android-v1 --title "STUDIOSB6L Android" --notes "Android app for STUDIOSB6L. Initial testing build; install from trusted official link only."
          gh release upload android-v1 STUDIOSB6L-Android.apk --clobber
