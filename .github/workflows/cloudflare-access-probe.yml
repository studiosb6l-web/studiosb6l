name: Verify stored Cloudflare credential
on:
  push:
    branches:
      - ops/cloudflare-access-probe-20261124
permissions:
  contents: read
concurrency:
  group: studiosb6l-cloudflare-readonly-probe
  cancel-in-progress: false
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stored credential with two read-only management requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-api-access.mjs
      - name: Inspect readiness without revealing configuration values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const account='8ada1c4a636906c35b369d4d682f6d4e',database='f53175d9-50a7-4b6a-a868-1b10c997efc8';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'};
          const settingsResponse=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/studiosb6l-artists-api/settings',{headers,redirect:'error',signal:AbortSignal.timeout(15000)});
          if(!settingsResponse.ok)throw Error('Cannot inspect Worker settings: HTTP '+settingsResponse.status);
          const settings=await settingsResponse.json();
          if(settings.success!==true)throw Error('Worker settings were not confirmed');
          const bindings=settings.result.bindings||[];
          const presence=Object.fromEntries(['BREVO_API_KEY','REGISTRATION_FROM_EMAIL','EMAIL_SERVICE','PAYHIP_WEBHOOK_API_KEY','PAYHIP_ADMISSION_PRODUCT_KEY','PAYHIP_ADMISSION_CHECKOUT_URL','ADMISSION_REFERENCE_SECRET','AUTH_RATE_LIMIT'].map(name=>[name,bindings.some(b=>b.name===name)]));
          const enabled=Object.fromEntries(['LOGIN_ENABLED','REGISTRATION_ENABLED','PAYHIP_ACTIVATION_VERIFIED','EMAIL_BUDGET_VERIFIED','BREVO_SENDER_VERIFIED','STOP_SERVICE'].map(name=>[name,bindings.some(b=>b.name===name&&b.type==='plain_text'&&b.text==='true')]));
          const names=['accounts','sessions','account_onboarding','account_email_verifications','registration_email_budget','account_email_send_locks','payhip_admission_payments','payhip_admission_refunds'];
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database+'/query',{method:'POST',headers,redirect:'error',signal:AbortSignal.timeout(15000),body:JSON.stringify({sql:"SELECT name FROM sqlite_master WHERE type='table' AND name IN ("+names.map(()=>'?').join(',')+")",params:names})});
          let schema={readable:false,httpStatus:r.status};
          if(r.ok){const data=await r.json();if(data.success===true){const found=data.result?.[0]?.results||[];schema={readable:true,tables:Object.fromEntries(names.map(name=>[name,found.some(x=>x.name===name)]))};}}
          const report={present:presence,enabled,schema};
          fs.writeFileSync('.wrangler/access-check/readiness.json',JSON.stringify(report,null,2));
          const summary=['## Production prerequisites (presence only; no secret values)','',...Object.entries(presence).map(([k,v])=>k+': '+(v?'present':'missing')),'',...Object.entries(enabled).map(([k,v])=>k+': '+v),'','Schema read permission: '+schema.readable+' (HTTP '+r.status+')'];
          if(schema.tables)summary.push(...Object.entries(schema.tables).map(([k,v])=>'Table '+k+': '+(v?'present':'missing')));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n')+'\n');
          JS
      - name: Read recovery bookmark, schema metadata and daily D1 usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const account='8ada1c4a636906c35b369d4d682f6d4e',database='f53175d9-50a7-4b6a-a868-1b10c997efc8';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'};
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database;
          const now=new Date(),day=now.toISOString().slice(0,10);
          async function read(url,body){
            const r=await fetch(url,{method:body?'POST':'GET',headers,redirect:'error',signal:AbortSignal.timeout(15000),body:body?JSON.stringify(body):undefined});
            const d=await r.json().catch(()=>null);return {status:r.status,ok:r.ok,data:d};
          }
          const bookmark=await read(base+'/time_travel/bookmark?timestamp='+encodeURIComponent(new Date(now.getTime()-5000).toISOString()));
          const recovery={checkedAt:now.toISOString(),httpStatus:bookmark.status,available:bookmark.ok&&bookmark.data?.success===true&&typeof bookmark.data.result?.bookmark==='string'};
          if(recovery.available)recovery.bookmark=bookmark.data.result.bookmark;
          fs.writeFileSync('.wrangler/access-check/recovery.json',JSON.stringify(recovery,null,2));
          const names=['accounts','sessions','account_onboarding','account_email_verifications','registration_email_budget','account_email_send_locks','payhip_admission_payments','payhip_admission_refunds'];
          const schema=await read(base+'/query',{sql:"SELECT name,type,tbl_name,sql FROM sqlite_master WHERE tbl_name IN ("+names.map(()=>'?').join(',')+") AND type IN ('table','index')",params:names});
          if(!schema.ok||schema.data?.success!==true)throw Error('Schema metadata unavailable: HTTP '+schema.status);
          fs.writeFileSync('.wrangler/access-check/schema-metadata.json',JSON.stringify({checkedAt:now.toISOString(),objects:schema.data.result?.[0]?.results||[]},null,2));
          const query='query DailyD1($accountTag: string!, $day: Date!) { viewer { accounts(filter: {accountTag: $accountTag}) { d1AnalyticsAdaptiveGroups(limit: 1, filter: {date_geq: $day, date_leq: $day}) { sum { rowsRead rowsWritten } } } } }';
          const usage=await read('https://api.cloudflare.com/client/v4/graphql',{query,variables:{accountTag:account,day}});
          const entries=usage.data?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups;
          const valid=usage.ok&&!usage.data?.errors?.length&&Array.isArray(entries);
          const report={checkedAt:now.toISOString(),utcDay:day,httpStatus:usage.status,available:valid,globalHeadroomVerified:false};
          if(valid){report.rowsRead=entries.reduce((n,x)=>n+Number(x.sum?.rowsRead||0),0);report.rowsWritten=entries.reduce((n,x)=>n+Number(x.sum?.rowsWritten||0),0);}
          if(usage.data?.errors?.length)report.errors=usage.data.errors.map(x=>String(x.message).slice(0,300));
          fs.writeFileSync('.wrangler/access-check/d1-usage.json',JSON.stringify(report,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nRecovery bookmark available: '+recovery.available+'\nSchema metadata inspected without reading account records.\nDaily D1 usage readable: '+valid+'\nNo database writes executed.\n');
          JS
      - name: Preserve non-secret target and rollback identifiers
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-access-verification
          path: .wrangler/access-check/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Report verified access without publishing
        run: |
          {
            echo '## Cloudflare credential verified'
            echo 'The stored token read the approved Worker settings and deployed version identifiers.'
            echo 'The approved D1 binding was confirmed.'
            echo 'No code, database, secrets, payment configuration or plan was changed.'
            echo 'No production readiness, free quota headroom or real payment was validated.'
          } >> "$GITHUB_STEP_SUMMARY"
