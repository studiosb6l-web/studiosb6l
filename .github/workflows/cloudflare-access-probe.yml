name: Read current publication prerequisites through stored API access
on:
  push:
    branches: [ops/cloudflare-access-probe-20261124]
permissions:
  contents: read
concurrency:
  group: studiosb6l-cloudflare-readonly-probe
  cancel-in-progress: false
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current fixed-target configuration and account-wide daily metrics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const account='8ada1c4a636906c35b369d4d682f6d4e';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('Stored Cloudflare credential unavailable');
          const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};
          async function api(path,body){
           const r=await fetch('https://api.cloudflare.com/client/v4'+path,{method:body?'POST':'GET',headers,redirect:'error',signal:AbortSignal.timeout(15000),body:body?JSON.stringify(body):undefined});
           const d=await r.json().catch(()=>null);
           if(!r.ok||d?.success===false||d?.errors?.length)throw Error('Management read failed: HTTP '+r.status);
           return d;
          }
          const now=new Date(), day=now.toISOString().slice(0,10), start=day+'T00:00:00Z';
          const report={checkedAt:now.toISOString(),operation:'read-only-readiness',deployExecuted:false,registrationActivated:false};
          const settings=await api('/accounts/'+account+'/workers/scripts/studiosb6l-artists-api/settings');
          const bindings=settings.result?.bindings||[];
          report.present=Object.fromEntries(['DB','AUTH_RATE_LIMIT','BREVO_API_KEY','REGISTRATION_FROM_EMAIL','EMAIL_SERVICE','PAYHIP_WEBHOOK_API_KEY','ADMISSION_REFERENCE_SECRET','PAYHIP_ADMISSION_PRODUCT_KEY','PAYHIP_ADMISSION_CHECKOUT_URL'].map(n=>[n,bindings.some(b=>b.name===n)]));
          report.enabled=Object.fromEntries(['LOGIN_ENABLED','REGISTRATION_ENABLED','PAYHIP_ACTIVATION_VERIFIED','BREVO_SENDER_VERIFIED','EMAIL_BUDGET_VERIFIED','STOP_SERVICE'].map(n=>[n,bindings.some(b=>b.name===n&&b.type==='plain_text'&&b.text==='true')]));
          report.quotas={};
          for(const [name,query,variables] of [
           ['workers','query Usage($accountTag: string, $start: string, $end: string) { viewer { accounts(filter: {accountTag: $accountTag}) { workersInvocationsAdaptive(limit: 1, filter: {datetime_geq: $start, datetime_leq: $end}) { sum { requests } } } } }',{accountTag:account,start,end:now.toISOString()}],
           ['d1','query Usage($accountTag: string!, $day: Date!) { viewer { accounts(filter: {accountTag: $accountTag}) { d1AnalyticsAdaptiveGroups(limit: 1, filter: {date_geq: $day, date_leq: $day}) { sum { rowsRead rowsWritten } } } } }',{accountTag:account,day}]
          ]){
           try {
            const d=await api('/graphql',{query,variables}), a=d.data?.viewer?.accounts;
            if(!Array.isArray(a)||a.length!==1)throw Error('Account metrics unavailable');
            const rows=a[0][name==='workers'?'workersInvocationsAdaptive':'d1AnalyticsAdaptiveGroups'];
            if(!Array.isArray(rows))throw Error('Dataset unavailable');
            const fields=name==='workers'?['requests']:['rowsRead','rowsWritten'];
            const totals=Object.fromEntries(fields.map(f=>[f,0]));
            for(const row of rows)for(const f of fields){const n=row.sum?.[f];if(!Number.isSafeInteger(n)||n<0)throw Error('Invalid metrics');totals[f]+=n;}
            report.quotas[name]={available:true,utcDay:day,...totals};
           }catch{report.quotas[name]={available:false};}
          }
          fs.mkdirSync('.wrangler/access-check',{recursive:true});
          fs.writeFileSync('.wrangler/access-check/publication-readiness.json',JSON.stringify(report,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Current API publication readiness\n\n'+JSON.stringify(report,null,2)+'\n\nNo migrations, credential changes, emails, payments or deployments executed.\n');
          console.log(JSON.stringify(report));
          JS
      - name: Verify one registration email to the owner's confirmed mailbox alias
        run: |
          node --input-type=module - <<'JS'
          import {randomBytes} from 'node:crypto';
          const response=await fetch('https://studiosb6l-artists-api.studiosb6l.workers.dev/api/auth/register',{method:'POST',redirect:'error',signal:AbortSignal.timeout(20000),headers:{'Content-Type':'application/json','Origin':'https://www.studiosb6l.com'},body:JSON.stringify({email:'studiosb6l+activation20261124@gmail.com',password:randomBytes(32).toString('base64url'),role:'artist',acceptTerms:true})});
          if(response.status!==202){const result=await response.json().catch(()=>({}));console.log(JSON.stringify({registrationSmokeStatus:response.status,error:result.error||'Unavailable'}));throw Error('Registration email smoke failed');}
          console.log('Registration request accepted. Inactive test account only; no payment or access granted. Mailbox delivery must be checked separately.');
          JS
      - name: Preserve non-secret publication prerequisites
        uses: actions/upload-artifact@v4
        with:
          name: publication-readiness
          path: .wrangler/access-check/publication-readiness.json
          if-no-files-found: error
          retention-days: 7
