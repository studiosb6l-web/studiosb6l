name: Public Beta feedback
description: Report a public website problem or suggest a feature (no sensitive data)
title: "[Public Beta] "
labels: ["public-beta"]
body:
  - type: markdown
    attributes:
      value: "Never include passwords, payment details, identity documents, private personal information or security exploit details. For sensitive issues contact the official support email privately."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Artist profiles
        - Opportunities and matching
        - Languages and accessibility
        - Music store
        - Mobile and installation
        - Other
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem or suggestion
      description: What happened and what should happen?
    validations:
      required: true
