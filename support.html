ntes","Les contributions ne donnent aucun droit de propriété sur les œuvres ni participation au projet. Le parrainage publicitaire peut nécessiter contrat et facture. PayPal traite les paiements et affiche ses conditions et frais.","Demander une mention ou des informations","Retour au site officiel","Choisissez ou saisissez le montant sur PayPal. Vérifiez que le destinataire est BANDA 6 LATINOS avant de payer."],"de":["Unterstützen Sie die Zukunft von STUDIOSB6L","Unabhängige Musik wächst mit Menschen, die an sie glauben.","Ihr Beitrag unterstützt die Studioentwicklung, moderne Audiotechnik, Abhörsysteme, professionelle Software und neue originale Filmmusikkompositionen.","Private Unterstützer","Ab 2 €","Spendieren Sie uns einen Kaffee und unterstützen Sie neue Musikproduktionen.","Mit PayPal unterstützen","Unternehmenspartner","Ab 50 €","Ihr Unternehmen kann künstlerische und technische Innovation fördern. Nach Vereinbarung präsentieren wir Namen, Logo und Website-Link.","Mit PayPal teilnehmen","Wofür wir Beiträge einsetzen","Audiogeräte und Abhörsysteme","Kompositions-, Mixing- und Mastering-Software","Studioinfrastruktur und neue Originalwerke","Öffentliche Anerkennung","Privatpersonen können namentlich genannt werden oder anonym bleiben. Unternehmen können eine Markennennung nach Vereinbarung und Einwilligung anfragen. Es erfolgt keine automatische Veröffentlichung.","Wichtige Hinweise","Beiträge verleihen weder Rechte an Musikwerken noch Unternehmensanteile. Werbesponsoring kann Vertrag und Rechnung erfordern. PayPal wickelt Zahlungen ab und zeigt geltende Bedingungen und Gebühren.","Nennung oder Informationen anfragen","Zur offiziellen Website","Wählen oder geben Sie den Betrag bei PayPal ein. Prüfen Sie vor der Zahlung BANDA 6 LATINOS als Empfänger."]};const sel=document.getElementById('lang');function render(){const l=sel.value;document.documentElement.lang=l;document.querySelectorAll('[data-k]').forEach(el=>{el.textContent=tr[l][keys.indexOf(el.dataset.k)]}
