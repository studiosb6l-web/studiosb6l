# D1 database_id must be taken from Cloudflare; do not invent it.
# [[d1_databases]]
# binding = "DB"
# database_name = "YOUR_EXISTING_D1_NAME"
# database_id = "YOUR_REAL_DATABASE_ID"
[vars]
STOP_SERVICE = "true"
ALLOWED_FEED_HOSTS = ""
