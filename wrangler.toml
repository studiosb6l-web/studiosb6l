# Deployment target confirmed from the owner's Cloudflare dashboard.
# Do not enable Builds until schema, routing and edge limits are verified.
name = "studiosb6l-artists-api"
main = "cloudflare/artists-api-entry.mjs"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[[d1_databases]]
binding = "DB"
database_name = "studiosb6l-artists-db"
database_id = "f53175d9-50a7-4b6a-a868-1b10c997efc8"

# Isolated D1 binding for Cloudflare preview builds (never production DB).
[[previews.d1_databases]]
binding = "DB"
database_name = "studiosb6l-artists-preview-db"
database_id = "89908805-b194-4a1b-8250-b17090dc1499"

[vars]
LOGIN_ENABLED = "true"

[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "2026112301"
simple = { limit = 10, period = 60 }

# No migrations, schedules, paid resources or custom routes are applied here.
# Login additionally requires runtime crypto readiness and a functioning limiter.
# Owner accounts remain blocked pending separately verified administrative MFA.
