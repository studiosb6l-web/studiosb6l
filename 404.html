<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>STUDIOSB6L — Recuperar acesso</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a1019;color:#f7f4ed;font:16px system-ui,sans-serif}main{max-width:560px;margin:24px;padding:32px;border:1px solid #806b43;border-radius:20px;background:#142233;text-align:center}h1{color:#dfbd78;font-size:2rem}p{line-height:1.6}a{display:inline-block;background:#dfbd78;color:#101820;text-decoration:none;padding:14px 20px;margin:8px;border-radius:10px;font-weight:700}.secondary{background:#273e54;color:white}small{color:#b9c3cf}</style></head><body><main><h1>STUDIOSB6L</h1><h2>Vamos recuperar a ligação</h2><p>Esta página não está disponível. Pode abrir a plataforma principal e continuar a navegar.</p><p><a href="/conta/" id="home">Entrar / Criar conta</a><a class="secondary" href="/rede/">Procurar / Oferecer</a><a class="secondary" href="/">Página principal</a></p><p><small id="status">Se chegou aqui através de um botão, essa ligação precisa de ser corrigida.</small></p></main><script>
