us:5px;font-weight:bold;cursor:pointer}.note{color:#c5c3bf}input[type=checkbox]{width:auto;display:inline-block}</style></head><body><header><div class="wrap"><a href="/">STUDIOSB6L</a> · <a href="/concertos/artistas/">艺术家目录</a></div></header><main class="wrap"><nav aria-label="Languages"><a href="/artistas/" hreflang="pt">PT</a><a href="/artistas/es/" hreflang="es">ES</a><a href="/artistas/en/" hreflang="en">EN</a><a href="/artistas/fr/" hreflang="fr">FR</a><a href="/artistas/de/" hreflang="de">DE</a><a href="/artistas/ja/" hreflang="ja">JA</a><a href="/artistas/zh/" hreflang="zh">ZH</a><a href="/artistas/ar/" hreflang="ar">AR</a><a href="/artistas/ru/" hreflang="ru">RU</a><a href="/artistas/uk/" hreflang="uk">UK</a></nav><h1>你的音乐，你的观众，我们的全球舞台。</h1><p>欢迎来自世界各地的独立及知名艺术家、经纪公司、唱片公司和演出主办方。</p><section class="panel" aria-labelledby="private-area-title"><p style="display:inline-block;background:#352a16;color:#f6d58d;border:1px solid #d4b36d;border-radius:5px;padding:6px 12px;font-weight:bold">建设中 — 敬请期待</p><h2 id="private-area-title">艺术家个人专区</h2><p>我们正在开发用于管理资料、照片、音乐和演出的私人账户。目前尚不支持密码登录。</p></section><section class="panel"><h2>申请加入</h2><p>提交艺术家资料、演出信息或合作提案。</p><form id="apply"><label>申请类型<select name="request" required><option value="">—</option><option>艺术家注册</option><option>宣传演出</option><option>认领或更正资料页</option><option>经纪公司、唱片公司或合作</option></select></label><label>艺术家或机构名称<input name="artist" required maxlength="140"></label><label>联系人姓名<input name="contact" required maxlength="120"></label><label>专业联系邮箱<input name="email" type="email" required maxlength="160"></label><label>国家／城市<input name="location" required maxlength="120"></label><label>你的身份<select name="role" required><option value="">—</option><option>艺术家本人</option><option>授权代表</option><option>唱片公司或经纪公司</option><option>演出主办方</option><option>其他</option></select></label><label>官方网站<input name="website" type="url" maxlength="300"></label><label>现有资料页网址<input name="profile" type="url" maxlength="300"></label><label>项目或演出详情<textarea name="details" required maxlength="2500"></textarea></label><label><input type="checkbox" required> 我确认有权提交此申请。</label><p><button type="submit">准备申请邮件</button></p><p class="note">将打开你的邮件应用；不会自动发送。</p><p class="note" id="status" role="status"></p></form></section><p>所有申请均须审核后发布。初期免费参与，无独家限制，也无需转让音乐版权。</p><p>STUDIOSB6L · <a href="mailto:studiosb6l@gmail.com">studiosb6l@gmail.com</a></p></main><script>document.getElementById('apply').addEventListener('submit',function(e){e.preventDefault();if(!this.reportValidity())return;const d=new FormData(this),subject='STUDIOSB6L - '+d.get('request')+' - '+d.get('artist'),body=Array.from(d.entries()).map(x=>x[0]+': '+x[1]).join('\n\n');document.getElementById('status').textContent="将打开你的邮件应用；不会自动发送。";location.href='mailto:studiosb6l@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)});</script><script src="/assets/language-navigation.js"></script></body></html>
